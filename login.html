<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk | IkyApi'S</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #0f1117;
            --bg-card: #11131d;
            --bg-gradient: linear-gradient(135deg, #1a1b2e 0%, #0f1117 100%);
            --text-primary: #ffffff;
            --text-secondary: #b0b7d6;
            --text-muted: #6b7299;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --accent-gradient: linear-gradient(135deg, #6366f1, #8b5cf6);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border: rgba(255, 255, 255, 0.08);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.5);
            --glow: 0 0 20px var(--accent-glow);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --radius: 20px;
            --radius-sm: 12px;
        }

        [data-theme="light"] {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #ffffff 100%);
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --accent: #4f46e5;
            --accent-glow: rgba(79, 70, 229, 0.2);
            --warning: #d97706;
            --danger: #dc2626;
            --border: rgba(0, 0, 0, 0.08);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Background 3D Modern */
        #bg3d-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            opacity: 0.7;
        }

        .grid-bg {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background-image: 
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 40s linear infinite;
            opacity: 0.15;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(60px, 60px); }
        }

        .floating-shape {
            position: absolute;
            border-radius: 20px;
            background: var(--accent-gradient);
            filter: blur(40px);
            opacity: 0.1;
            animation: floatShape 20s infinite ease-in-out;
        }

        .shape-1 {
            width: 300px;
            height: 300px;
            top: 10%;
            right: 10%;
            animation-delay: 0s;
        }

        .shape-2 {
            width: 400px;
            height: 400px;
            bottom: 10%;
            left: 10%;
            animation-delay: 5s;
        }

        .shape-3 {
            width: 200px;
            height: 200px;
            top: 50%;
            right: 20%;
            animation-delay: 10s;
        }

        @keyframes floatShape {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        .container {
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
        }

        /* Back Button */
        .back-button {
            position: fixed;
            top: 30px;
            left: 30px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 12px 24px;
            border-radius: 50px;
            box-shadow: var(--shadow);
            cursor: pointer;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            transition: var(--transition);
            text-decoration: none;
            color: var(--text-primary);
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
            background: var(--accent);
            color: white;
        }

        /* Theme Toggle */
        .theme-toggle {
            position: fixed;
            top: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-primary);
            box-shadow: var(--shadow);
            z-index: 1000;
        }

        .theme-toggle:hover {
            transform: rotate(30deg);
            box-shadow: var(--shadow-lg);
            border-color: var(--accent);
        }

        /* Login Card */
        .login-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 40px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            transform: translateY(20px);
            animation: slideUp 0.6s ease forwards;
        }

        @keyframes slideUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--accent-gradient);
        }

        .brand {
            text-align: center;
            margin-bottom: 40px;
        }

        .brand-logo {
            width: 70px;
            height: 70px;
            background: var(--accent-gradient);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: white;
            font-size: 28px;
            font-weight: 800;
            box-shadow: 0 8px 20px var(--accent-glow);
        }

        .brand h1 {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .brand p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        /* Form */
        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            margin-bottom: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.875rem;
        }

        .input-with-icon {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            z-index: 1;
            font-size: 1.1rem;
        }

        .form-input {
            width: 100%;
            padding: 16px 20px 16px 56px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            transition: var(--transition);
            font-size: 1rem;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: var(--glow);
        }

        .password-toggle {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
            font-size: 1.1rem;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .password-toggle:hover {
            color: var(--accent);
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .remember input[type="checkbox"] {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: var(--transition);
        }

        .remember input[type="checkbox"]:checked {
            background: var(--accent);
            border-color: var(--accent);
        }

        .remember label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
        }

        .forgot-link {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: var(--transition);
        }

        .forgot-link:hover {
            color: var(--accent);
            text-decoration: underline;
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 16px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .btn-primary {
            background: var(--accent-gradient);
            color: white;
            box-shadow: 0 8px 20px var(--accent-glow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px var(--accent-glow);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border: 1px solid var(--border);
            margin-top: 16px;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            margin: 30px 0;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider span {
            padding: 0 20px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Alternative Login */
        .social-login {
            display: flex;
            gap: 16px;
            margin-bottom: 30px;
        }

        .social-btn {
            flex: 1;
            padding: 16px;
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            border-color: var(--border);
        }

        .social-btn.google:hover {
            background: #DB4437;
            color: white;
            border-color: #DB4437;
        }

        .social-btn.github:hover {
            background: #333;
            color: white;
            border-color: #333;
        }

        /* Register Link */
        .register-link {
            text-align: center;
            margin-top: 30px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .register-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 700;
            margin-left: 8px;
            transition: var(--transition);
            border-bottom: 2px solid transparent;
            padding-bottom: 2px;
        }

        .register-link a:hover {
            border-bottom-color: var(--accent);
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 40px;
            right: 40px;
            background: var(--accent-gradient);
            color: white;
            padding: 20px 30px;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1002;
            transform: translateY(100px);
            opacity: 0;
            transition: var(--transition);
            max-width: 350px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.error {
            background: var(--danger);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .back-button {
                top: 20px;
                left: 20px;
                padding: 10px 20px;
            }
            
            .theme-toggle {
                top: 20px;
                right: 20px;
                width: 45px;
                height: 45px;
            }
            
            .login-card {
                padding: 30px 25px;
            }
            
            .brand-logo {
                width: 60px;
                height: 60px;
                font-size: 24px;
            }
            
            .brand h1 {
                font-size: 1.75rem;
            }
            
            .back-button span {
                display: none;
            }
            
            .back-button {
                padding: 10px;
                width: 45px;
                height: 45px;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }
            
            .login-card {
                padding: 25px 20px;
            }
            
            .brand h1 {
                font-size: 1.5rem;
            }
            
            .social-login {
                flex-direction: column;
            }
            
            .remember-forgot {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            
            .toast {
                right: 20px;
                left: 20px;
                max-width: none;
                bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Background 3D -->
    <div id="bg3d-container">
        <div class="grid-bg"></div>
        <div class="floating-shape shape-1"></div>
        <div class="floating-shape shape-2"></div>
        <div class="floating-shape shape-3"></div>
    </div>

    <!-- Back Button -->
    <a href="/" class="back-button" aria-label="Kembali ke Beranda">
        <i class="fas fa-arrow-left"></i>
        <span>Kembali</span>
    </a>

    <!-- Theme Toggle -->
    <div class="theme-toggle" onclick="toggleTheme()">
        <i class="fas fa-moon" id="theme-icon"></i>
    </div>

    <div class="container">
        <div class="login-card">
            <!-- Brand -->
            <div class="brand">
                <div class="brand-logo">I</div>
                <h1>Selamat Datang</h1>
                <p>Masuk untuk mengakses platform IkyApi'S</p>
            </div>

            <!-- Social Login -->
            <div class="social-login">
                <button class="social-btn google" onclick="loginWithGoogle()">
                    <i class="fab fa-google"></i> Google
                </button>
                <button class="social-btn github" onclick="loginWithGithub()">
                    <i class="fab fa-github"></i> GitHub
                </button>
            </div>

            <div class="divider">
                <span>Atau lanjutkan dengan</span>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <!-- Username -->
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <div class="input-with-icon">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="username" class="form-input" placeholder="Masukkan username Anda" required>
                    </div>
                </div>

                <!-- Password/Phone -->
                <div class="form-group">
                    <label class="form-label" for="password">Password atau Nomor Telepon</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" class="form-input" placeholder="Masukkan password atau nomor telepon" required>
                        <button type="button" class="password-toggle" onclick="togglePassword()">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember & Forgot -->
                <div class="remember-forgot">
                    <div class="remember">
                        <input type="checkbox" id="remember">
                        <label for="remember">Ingat saya</label>
                    </div>
                    <a href="#" class="forgot-link">Lupa password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Masuk
                </button>
            </form>

            <!-- Register Link -->
            <div class="register-link">
                Belum punya akun?
                <a href="#" onclick="register()" id="registerLink">Buat Akun</a>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage"></span>
    </div>

    <script>
        // Theme Management - UPDATED
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            html.setAttribute('data-theme', newTheme);
            
            const themeIcon = document.getElementById('theme-icon');
            
            if (newTheme === 'dark') {
                themeIcon.className = 'fas fa-moon';
            } else {
                themeIcon.className = 'fas fa-sun';
            }
            
            localStorage.setItem('theme', newTheme);
        }

        // Load saved theme
        function loadTheme() {
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = savedTheme || (systemPrefersDark ? 'dark' : 'dark');
            
            document.documentElement.setAttribute('data-theme', theme);
            
            const themeIcon = document.getElementById('theme-icon');
            
            if (theme === 'dark') {
                themeIcon.className = 'fas fa-moon';
            } else {
                themeIcon.className = 'fas fa-sun';
            }
        }

        // Toggle Password Visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.querySelector('.password-toggle i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                toggleIcon.className = 'fas fa-eye';
            }
        }

        // User Storage
        function getUsers() {
            const users = localStorage.getItem('ikyapi_users');
            return users ? JSON.parse(users) : [];
        }

        function saveUsers(users) {
            localStorage.setItem('ikyapi_users', JSON.stringify(users));
        }

        // Register function
        function register() {
            const username = prompt('Masukkan username baru:');
            if (!username || username.trim() === '') {
                showToast('Username tidak boleh kosong', 'error');
                return;
            }

            const password = prompt('Masukkan password baru:');
            if (!password || password.length < 3) {
                showToast('Password minimal 3 karakter', 'error');
                return;
            }

            const users = getUsers();
            
            // Check if username already exists
            if (users.find(user => user.username === username)) {
                showToast('Username sudah digunakan', 'error');
                return;
            }

            // Create new user
            const newUser = {
                id: 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
                username: username.trim(),
                password: password,
                phone: '',
                email: '',
                createdAt: new Date().toISOString()
            };

            users.push(newUser);
            saveUsers(users);
            
            // Auto login
            localStorage.setItem('current_user', JSON.stringify(newUser));
            showToast('Akun berhasil dibuat! Mengalihkan...');
            
            setTimeout(() => {
                window.location.href = '/dashboard';
            }, 1500);
        }

        // Check if user exists
        function checkUserExists(username, password) {
            const users = getUsers();
            return users.find(user => 
                user.username === username && 
                (user.password === password || user.phone === password)
            );
        }

        // Toast Notification
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            
            toast.classList.remove('error');
            if (type === 'error') {
                toast.classList.add('error');
                toast.querySelector('i').className = 'fas fa-exclamation-circle';
            } else {
                toast.querySelector('i').className = 'fas fa-check-circle';
            }
            
            toastMessage.textContent = message;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Form Submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            
            // Simple validation
            if (!username || !password) {
                showToast('Harap isi semua field', 'error');
                return;
            }
            
            // Check user credentials
            const user = checkUserExists(username, password);
            
            if (user) {
                // Save current user session
                localStorage.setItem('current_user', JSON.stringify(user));
                
                // Save remember me preference
                const rememberMe = document.getElementById('remember').checked;
                if (rememberMe) {
                    localStorage.setItem('remembered_user', username);
                } else {
                    localStorage.removeItem('remembered_user');
                }
                
                showToast('Login berhasil! Mengalihkan...');
                
                // Redirect to dashboard after 1 second
                setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 1000);
            } else {
                // Check if account exists
                const users = getUsers();
                const userExists = users.find(u => u.username === username);
                
                if (userExists) {
                    showToast('Password atau nomor telepon salah', 'error');
                } else {
                    showToast('Akun tidak ditemukan. Buat akun terlebih dahulu.', 'error');
                    
                    // Highlight register link
                    const registerLink = document.getElementById('registerLink');
                    registerLink.style.color = 'var(--danger)';
                    registerLink.style.fontWeight = 'bold';
                    
                    setTimeout(() => {
                        registerLink.style.color = '';
                        registerLink.style.fontWeight = '';
                    }, 3000);
                }
            }
        });

        // Social Login (Placeholder functions)
        function loginWithGoogle() {
            showToast('Login Google belum tersedia', 'error');
        }

        function loginWithGithub() {
            showToast('Login GitHub belum tersedia', 'error');
        }

        // Check if user is already logged in
        function checkLoginStatus() {
            const currentUser = localStorage.getItem('current_user');
            if (currentUser) {
                // Optionally redirect to dashboard if already logged in
                // window.location.href = '/dashboard';
            }
        }

        // Fill remembered username
        function fillRememberedUser() {
            const rememberedUser = localStorage.getItem('remembered_user');
            if (rememberedUser) {
                document.getElementById('username').value = rememberedUser;
                document.getElementById('remember').checked = true;
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
